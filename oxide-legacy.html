 for(let i=0;i<30;i++){g.fillStyle=q()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.06)';g.beginPath();g.arc(q()*128,q()*128,8+q()*22,0,7);g.fill()}
 for(let i=0;i<700;i++){g.fillStyle=q()<.5?'rgba(0,0,0,.16)':'rgba(255,255,255,.1)';g.fillRect(q()*128,q()*128,1+q()*3,1+q()*3)}
 if(c==0xffffff){for(let i=0;i<500;i++){g.strokeStyle=q()<.5?'rgba(0,0,0,.2)':'rgba(255,255,255,.15)';g.beginPath();const x=q()*128,y=q()*128;g.moveTo(x,y);g.lineTo(x+q()*3-1.5,y-3-q()*5);g.stroke()}}
 if(pl){for(let y=0;y<128;y+=32){g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,y,128,3)}for(let i=0;i<60;i++){g.fillStyle='rgba(0,0,0,.08)';g.fillRect(q()*128,0,1,128)}}
 const t=new THREE.CanvasTexture(k);t.anisotropy=4;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);return tc[key]=t}

 return m*k*(Math.max(0,9*Math.sin(x*.045+1)*Math.cos(z*.04)+7*Math.sin(z*.02+x*.03)+4)+14*Math.max(0,Math.sin(x*.013+2)*Math.sin(z*.017)))}
